<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Line-up Porto do Recife</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: faixa azul-marinho no topo, quatro abas-resumo, quadro de cais e lista de navios em linhas que viram cartões no celular. */
:root{
  color-scheme:light;
  --bg:#F2F6FA; --surface:#FFFFFF; --ink:#0B2236; --muted:#566B7E; --line:#D8E2EB;
  --head:#0A3159; --head-ink:#FFFFFF; --head-muted:#A9C2DA;
  --blue:#1169A8; --blue-soft:#E3F0FA; --sun:#E9A913; --sun-soft:#FBF0D2; --sun-ink:#6B4A00;
  --track:#E3EAF1; --focus:#1169A8; --danger:#B3261E; --danger-soft:#FBE4E2; --on-blue:#FFFFFF;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#07131E; --surface:#0E2031; --ink:#E6EEF5; --muted:#8CA3B8; --line:#1C3347;
    --head:#0A2540; --head-ink:#FFFFFF; --head-muted:#8FB0CF;
    --blue:#5AAEE6; --blue-soft:#12324B; --sun:#F2BE3B; --sun-soft:#3A2D0B; --sun-ink:#F5D586;
    --track:#173044; --focus:#5AAEE6; --danger:#F2877F; --danger-soft:#3C1714; --on-blue:#06141F;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.top{background:var(--head);color:var(--head-ink)}
.top .wrap{padding-block:22px 26px;display:flex;flex-wrap:wrap;gap:12px 32px;align-items:flex-end;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
.brand small{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--head-muted)}
.brand h1{margin:2px 0 0;font:700 clamp(26px,4.4vw,38px)/1.05 var(--f-display);text-wrap:balance}
.stamp{font-size:13px;color:var(--head-muted);text-align:right}
.stamp b{display:block;font:500 15px var(--f-mono);color:var(--head-ink)}
.stamp em{display:block;font-style:normal;font-size:12px;margin-top:2px}

.notice{background:var(--sun-soft);color:var(--sun-ink);border-bottom:1px solid var(--line)}
.notice .wrap{padding-block:10px;display:flex;gap:10px;align-items:baseline;font-size:14px}
.notice strong{font:600 12px var(--f-body);letter-spacing:.12em;text-transform:uppercase;flex:none}
.warn{background:var(--danger-soft);color:var(--danger);border-bottom:1px solid var(--line)}
.warn .wrap{padding-block:10px;font-size:14px}

.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:20px}
.tab{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px 14px;text-align:left;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:2px;min-width:0}
.tab .n{font:700 30px/1 var(--f-display)}
.tab .l{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tab:hover{border-color:var(--blue)}
.tab[aria-selected="true"]{background:var(--head);border-color:var(--head);color:var(--head-ink)}
.tab[aria-selected="true"] .l{color:var(--head-muted)}

.berths{margin-top:20px}
.sec-t{font:600 12px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.berth-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px}
.berth{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;min-height:62px}
.berth .c{font:500 11px var(--f-mono);letter-spacing:.06em;color:var(--muted)}
.berth .s{font-weight:600;font-size:13px;line-height:1.25;overflow-wrap:anywhere}
.berth.busy{border-color:var(--blue);background:var(--blue-soft)}
.berth.free .s{color:var(--muted);font-weight:400}

.tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;align-items:center}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}

.list{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:64px minmax(0,1.5fr) minmax(0,1.35fr) minmax(0,1.15fr) minmax(0,1.25fr) minmax(0,1.25fr);gap:6px 18px;padding:14px 18px;border-top:1px solid var(--line);align-items:start}
.row.head{border-top:0;background:var(--bg);padding-block:9px;font:600 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);align-items:center}
.row>div{min-width:0}
.berth-n{font:700 28px/1 var(--f-display);color:var(--blue)}
.berth-n small{display:block;font:500 10px var(--f-mono);letter-spacing:.1em;color:var(--muted);margin-bottom:2px}
.ship{font:700 18px/1.15 var(--f-display);overflow-wrap:anywhere}
.meta{font-size:12.5px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.mono{font-family:var(--f-mono);font-size:12px}
.cargo{font-weight:600;overflow-wrap:anywhere}
.pill{display:inline-block;margin-top:4px;padding:2px 9px;border-radius:999px;font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;background:var(--blue-soft);color:var(--blue)}
.pill.exp{background:var(--sun-soft);color:var(--sun-ink)}
.pill.neutral{background:var(--track);color:var(--muted)}
.who b{display:block;font-weight:600;overflow-wrap:anywhere}
.when div{white-space:nowrap}
.when .rel{color:var(--blue);font-size:12.5px;font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden;margin:2px 0 6px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.prog b{font-weight:600}
.lab{display:none}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}

footer{margin-top:28px;padding-block:20px 36px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 28px}
footer span{overflow-wrap:anywhere}
footer b{color:var(--ink);font-weight:600}

.c-rest{display:contents}
@media (max-width:900px){
  .row.head{display:none}
  .row{grid-template-columns:52px minmax(0,1fr);padding:16px;gap:12px 14px}
  .c-rest{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
  .c-prog{grid-column:1/-1}
  .lab{display:block;font:600 10.5px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
  .tab .n{font-size:26px}
}
@media (max-width:520px){
  .tabs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stamp{text-align:left}
}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .5s ease}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true"><rect width="46" height="46" rx="10" fill="#fff" fill-opacity=".1"/><path d="M8 30c4 0 4-4 8-4s4 4 8 4 4-4 8-4 4 4 6 4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path d="M8 37c4 0 4-4 8-4s4 4 8 4 4-4 8-4 4 4 6 4" fill="none" stroke="#F2BE3B" stroke-width="2.4" stroke-linecap="round"/><path d="M23 8v14M23 8l9 11H23z" fill="#fff"/></svg>
      <div><small>Porto do Recife</small><h1>Line-up de navios</h1></div>
    </div>
    <div class="stamp">Atualizado em<b id="stamp">—</b><em id="src">Lendo a planilha…</em></div>
  </div>
</header>
<div class="notice" id="notice" hidden><div class="wrap"><strong>Aviso</strong><span id="notice-t"></span></div></div>
<div class="warn" id="warn" hidden><div class="wrap" id="warn-t"></div></div>

<main class="wrap">
  <div class="tabs" role="tablist" aria-label="Situação dos navios" id="tabs"></div>

  <section class="berths" aria-label="Ocupação dos cais">
    <h2 class="sec-t">Ocupação dos cais agora</h2>
    <div class="berth-grid" id="berths"></div>
  </section>

  <div class="tools">
    <input class="search" id="q" type="search" placeholder="Buscar navio, carga, agência ou operador" aria-label="Buscar">
    <div class="chips" id="chips" role="group" aria-label="Filtrar por operação">
      <button class="chip" type="button" data-m="" aria-pressed="true">Todos</button>
      <button class="chip" type="button" data-m="IMPORTAÇÃO" aria-pressed="false">Importação</button>
      <button class="chip" type="button" data-m="EXPORTAÇÃO" aria-pressed="false">Exportação</button>
    </div>
  </div>

  <div class="list" id="panel" role="tabpanel" aria-live="polite"></div>

  <footer>
    <span><b>Telefones</b> <span id="f-tel"></span></span>
    <span><b>E-mail</b> <span id="f-mail"></span></span>
    <span>N/I: não informado</span>
  </footer>
</main>

<script>
/* =====================================================================
   CONFIGURAÇÃO — é só aqui que se mexe.
   ===================================================================== */
var CONFIG = {
  /* Código da planilha: o trecho entre /d/ e /edit no endereço dela. */
  sheetId: "1XjIAXf2Gvq-qDe9cvhflgSkjTF3CJ-019d9Uqr2MDRg",

  /* Nome de cada aba, exatamente como aparece embaixo na planilha.
     "layout" diz em que colunas estão os dados (veja LAYOUTS abaixo).
     "url": opcional. Se a aba foi publicada na web em CSV, cole o link aqui. */
  tabs: {
    atracados:    {sheet:"ATRACADOS",    layout:"atracados", url:""},
    previstos:    {sheet:"PREVISTOS",    layout:"previstos", url:""},
    fundeados:    {sheet:"FUNDEADOS",    layout:"atracados", url:""},
    desatracados: {sheet:"DESATRACADOS", layout:"atracados", url:""}
  },

  /* A página relê a planilha sozinha a cada tantos segundos. */
  refreshSeconds: 60,

  telefones: "81 3183-1919 · 81 99488-2036",
  emails: "operacoes@portodorecife.pe.gov.br · pedro.guarines@portodorecife.pe.gov.br"
};

/* Posição de cada informação na linha da planilha (A = 0, B = 1, C = 2...). */
var LAYOUTS = {
  atracados: {chegada:0, saida:1, cais:2, navio:3, cbo:4, comp:5, calado:6, agencia:7, operador:8, carga:9, mod:10, origem:11, anterior:12, prev:14, mov:15},
  previstos: {chegada:0, saida:2, cais:3, navio:4, imo:5, comp:6, calado:7, agencia:8, operador:9, carga:10, mod:11, origem:12, anterior:13, prev:15}
};

/* ===== LEITURA DA PLANILHA ===== */
var TABS = [
  {id:"atracados",label:"Atracados"},
  {id:"previstos",label:"Previstos"},
  {id:"fundeados",label:"Fundeados"},
  {id:"desatracados",label:"Desatracados"}
];

function parseCsv(text){
  var rows = [], row = [], cell = "", q = false, i = 0, c;
  text = String(text).replace(/^\uFEFF/,"");
  for(; i<text.length; i++){
    c = text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if(c==='"'){ q = true; }
    else if(c===","){ row.push(cell); cell = ""; }
    else if(c==="\n" || c==="\r"){
      if(c==="\r" && text[i+1]==="\n") i++;
      row.push(cell); cell = ""; rows.push(row); row = [];
    } else cell += c;
  }
  if(cell!=="" || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function clean(v){
  v = String(v==null?"":v).trim();
  var u = v.toUpperCase();
  return (u==="N/I" || u==="N/A" || u==="-" ) ? "" : v;
}
function toNum(v){ var n = parseInt(String(v||"").replace(/\D/g,""),10); return isNaN(n)?0:n; }
function cap(s){ return s ? s.charAt(0)+s.slice(1).toLowerCase() : s; }
var DATE_RE = /^\d\d\/\d\d\/\d{4}/;

function mapRows(rows, layout){
  var L = LAYOUTS[layout] || LAYOUTS.atracados;
  var items = [], aviso = "", atualizado = "";
  rows.forEach(function(r, idx){
    var a = String(r[0]||"").trim();
    if(/^NOTA/i.test(a)){ var t = String(r[1]||"").trim(); if(t) aviso = t; return; }
    if(idx<4 && !atualizado){
      for(var k=0;k<r.length;k++){ if(/^\d\d\/\d\d\/\d{4} \d\d:\d\d/.test(String(r[k]||"").trim())){ atualizado = String(r[k]).trim(); break; } }
    }
    if(!DATE_RE.test(a)) return;
    var navio = clean(r[L.navio]);
    if(!navio) return;
    var s = {
      chegada: a,
      saida: clean(r[L.saida]),
      cais: clean(r[L.cais]),
      navio: navio,
      cbo: L.cbo!=null ? clean(r[L.cbo]) : "",
      imo: L.imo!=null ? clean(r[L.imo]) : "",
      comp: clean(r[L.comp]),
      calado: clean(r[L.calado]),
      agencia: clean(r[L.agencia]),
      operador: clean(r[L.operador]),
      carga: clean(r[L.carga]),
      mod: clean(r[L.mod]).toUpperCase(),
      origem: clean(r[L.origem]),
      anterior: clean(r[L.anterior]),
      prev: toNum(r[L.prev]),
      mov: L.mov!=null ? toNum(r[L.mov]) : 0,
      tipo: ""
    };
    if(s.mod!=="IMPORTAÇÃO" && s.mod!=="EXPORTAÇÃO" && !s.prev){
      var t2 = s.mod || s.carga;
      if(t2){ s.tipo = cap(t2); s.mod = ""; }
    }
    if(!/ m$/i.test(s.comp) && s.comp) s.comp += " m";
    items.push(s);
  });
  return {items:items, aviso:aviso, atualizado:atualizado};
}

function tabUrl(t){
  if(t.url) return t.url;
  return "https://docs.google.com/spreadsheets/d/"+encodeURIComponent(CONFIG.sheetId)+"/gviz/tq?tqx=out:csv&sheet="+encodeURIComponent(t.sheet);
}
function loadTab(id){
  var t = CONFIG.tabs[id];
  return fetch(tabUrl(t), {cache:"no-store"}).then(function(res){
    if(!res.ok) throw new Error("HTTP "+res.status);
    return res.text();
  }).then(function(text){
    if(/^\s*<(!doctype|html)/i.test(text)) throw new Error("login");
    return mapRows(parseCsv(text), t.layout);
  });
}

/* === INTERFACE === */
var MES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
var HEADS = {
  atracados:["Cais","Navio","Carga","Agência / Operador","Datas","Carga movimentada"],
  previstos:["Cais","Navio","Carga","Agência / Operador","Datas","Tonelagem prevista"],
  fundeados:["Cais","Navio","Carga","Agência / Operador","Datas","Carga prevista"],
  desatracados:["Cais","Navio","Carga","Agência / Operador","Datas","Carga movimentada"]
};
var EMPTY = {
  atracados:"Nenhum navio atracado no momento.",
  previstos:"Nenhum navio previsto no momento.",
  fundeados:"Nenhum navio fundeado no momento.",
  desatracados:"Nenhum navio desatracado nesta lista."
};
var state = {tab:"atracados", mod:"", q:""};
var data = {};      /* id -> {items, aviso, atualizado} da última leitura boa */
var errors = {};    /* id -> true quando a última leitura falhou */
var lastOk = null;

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function $(id){return document.getElementById(id)}
function p2(n){return ("0"+n).slice(-2)}
function parseDate(s){
  var m = /^(\d\d)\/(\d\d)\/(\d{4})(?: (\d\d):(\d\d))?/.exec(s||"");
  return m ? new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0)) : null;
}
function fmt(s){
  var d = parseDate(s); if(!d) return "";
  var t = d.getDate()+" "+MES[d.getMonth()];
  if(d.getFullYear()!==new Date().getFullYear()) t += " "+d.getFullYear();
  return t+" · "+p2(d.getHours())+":"+p2(d.getMinutes());
}
function rel(s,verb){
  var d = parseDate(s); if(!d) return "";
  var h = (d - new Date())/36e5;
  if(h<=0) return "";
  return verb+" "+(h<24 ? "em "+Math.max(1,Math.round(h))+" h" : "em "+Math.round(h/24)+" d");
}
function num(n){return Number(n||0).toLocaleString("pt-BR")}
function modPill(m){
  if(!m) return "";
  return '<span class="pill'+(m==="EXPORTAÇÃO"?" exp":"")+'">'+esc(cap(m))+'</span>';
}
function listOf(id){ return (data[id] && data[id].items) || []; }

function row(s,lista){
  var prevList = lista==="previstos", special = !!s.tipo;
  var pct = s.prev>0 ? Math.min(100,Math.round((s.mov||0)/s.prev*100)) : 0;
  var meta = [];
  if(s.cbo) meta.push('<span class="mono">CBO '+esc(s.cbo)+'</span>');
  if(s.imo) meta.push('<span class="mono">IMO '+esc(s.imo)+'</span>');
  if(s.comp) meta.push(esc(s.comp));
  if(s.calado) meta.push('calado '+esc(s.calado));
  var cargo = special
    ? '<div class="cargo">'+esc(s.tipo)+'</div><span class="pill neutral">Sem carga</span>'
    : '<div class="cargo">'+esc(cap(s.carga)||"Não informada")+'</div>'+modPill(s.mod)+(s.origem?'<div class="meta">Origem/destino: '+esc(s.origem)+'</div>':'');
  var when, prog;
  if(prevList){
    var chega = rel(s.chegada,"chega");
    when = '<div>Chegada '+esc(fmt(s.chegada))+'</div>'+(chega?'<div class="rel">'+esc(chega)+'</div>':'')+(s.saida?'<div>Saída '+esc(fmt(s.saida))+'</div>':'');
    prog = '<div><b>'+num(s.prev)+'</b> t</div>'+(s.anterior?'<div class="meta">Vem de '+esc(s.anterior)+'</div>':'');
  } else {
    when = '<div>Chegada '+esc(fmt(s.chegada))+'</div>'+
      (s.saida?'<div>Saída '+esc(fmt(s.saida))+'</div>'+(lista==="atracados"?'<div class="rel">'+esc(rel(s.saida,"sai"))+'</div>':''):'<div class="meta">Saída não informada</div>');
    if(special || !s.prev){ prog = '<span class="meta">Sem movimentação de carga</span>'; }
    else if(lista==="fundeados"){ prog = '<div><b>'+num(s.prev)+'</b> t previstas</div>'; }
    else { prog = '<div class="bar"><i style="width:'+pct+'%"></i></div><div><b>'+num(s.mov)+'</b> de '+num(s.prev)+' t · '+pct+'%</div><div class="meta">Saldo '+num(s.prev-(s.mov||0))+' t</div>'; }
  }
  return '<div class="row">'+
    '<div class="c-berth berth-n"><small>CAIS</small>'+(s.cais?esc(s.cais):"—")+'</div>'+
    '<div class="c-ship"><div class="ship">'+esc(s.navio)+'</div><div class="meta">'+meta.join(" · ")+'</div></div>'+
    '<div class="c-rest">'+
      '<div class="c-cargo"><span class="lab">Carga</span>'+cargo+'</div>'+
      '<div class="c-who who"><span class="lab">Agência / Operador</span><b>'+esc(s.agencia||"Não informada")+'</b><span class="meta">'+(s.operador?esc(s.operador):"Sem operador")+'</span></div>'+
      '<div class="c-when when"><span class="lab">Datas</span>'+when+'</div>'+
      '<div class="c-prog prog"><span class="lab">'+esc(HEADS[lista][5])+'</span>'+prog+'</div>'+
    '</div></div>';
}
function matches(s){
  if(state.mod && s.mod!==state.mod) return false;
  if(state.q){
    var hay = [s.navio,s.carga,s.agencia,s.operador,s.origem,s.tipo].join(" ").toLowerCase();
    if(hay.indexOf(state.q)<0) return false;
  }
  return true;
}
function renderTabs(){
  $("tabs").innerHTML = TABS.map(function(t){
    var sel = t.id===state.tab;
    var n = data[t.id] ? data[t.id].items.length : "—";
    return '<button class="tab" role="tab" type="button" data-t="'+t.id+'" aria-selected="'+sel+'"><span class="n">'+n+'</span><span class="l">'+t.label+'</span></button>';
  }).join("");
}
function renderBerths(){
  var map = {};
  listOf("atracados").forEach(function(s){ if(s.cais){ (map[s.cais]=map[s.cais]||[]).push(s.navio); } });
  var html = "";
  for(var c=2;c<=9;c++){
    var sh = map[String(c)];
    html += '<div class="berth '+(sh?"busy":"free")+'"><div class="c">CAIS '+c+'</div><div class="s">'+(sh?sh.map(esc).join("<br>"):"Livre")+'</div></div>';
  }
  $("berths").innerHTML = html;
}
function renderPanel(){
  var id = state.tab, el = $("panel");
  if(!data[id]){
    el.innerHTML = '<div class="empty">'+(errors[id] ? "Não foi possível ler a aba "+esc(CONFIG.tabs[id].sheet)+". Veja a mensagem no topo da página." : "Carregando a planilha…")+'</div>';
    return;
  }
  var all = data[id].items, items = all.filter(matches);
  if(!items.length){
    el.innerHTML = '<div class="empty">'+(all.length ? "Nenhum navio encontrado com esses filtros." : EMPTY[id])+'</div>';
    return;
  }
  el.innerHTML = '<div class="row head">'+HEADS[id].map(function(h){return '<div>'+h+'</div>'}).join("")+'</div>' +
    items.map(function(s){return row(s,id)}).join("");
}
function renderHead(){
  var base = data.atracados || data.previstos || null;
  $("stamp").textContent = (base && base.atualizado) || "—";
  var avisoSrc = data.atracados && data.atracados.aviso ? data.atracados.aviso : "";
  $("notice").hidden = !avisoSrc;
  if(avisoSrc){
    var txt = avisoSrc;
    if(txt === txt.toUpperCase()){ txt = txt.toLowerCase(); txt = txt.charAt(0).toUpperCase()+txt.slice(1); }
    $("notice-t").textContent = txt;
  }
  var bad = TABS.filter(function(t){return errors[t.id]}).map(function(t){return CONFIG.tabs[t.id].sheet});
  var w = $("warn");
  if(bad.length){
    w.hidden = false;
    $("warn-t").textContent = "Não foi possível ler "+(bad.length>1?"as abas ":"a aba ")+bad.join(", ")+". Confira se a planilha está compartilhada como \"Qualquer pessoa com o link\" (leitor) e se o nome da aba está igual ao da planilha."+(lastOk?" Os dados abaixo são da última leitura, às "+lastOk+".":"");
  } else w.hidden = true;
  $("src").textContent = lastOk ? "Lido da planilha às "+lastOk+" · atualiza a cada "+CONFIG.refreshSeconds+" s" : "Lendo a planilha…";
}
function renderAll(){ renderHead(); renderTabs(); renderBerths(); renderPanel(); }

function refresh(){
  var jobs = TABS.map(function(t){
    return loadTab(t.id).then(function(r){ data[t.id] = r; errors[t.id] = false; return true; },
                              function(){ errors[t.id] = true; return false; });
  });
  Promise.all(jobs).then(function(oks){
    if(oks.some(Boolean)){ var d = new Date(); lastOk = p2(d.getHours())+":"+p2(d.getMinutes()); }
    renderAll();
  });
}

$("tabs").addEventListener("click",function(e){
  var b = e.target.closest("[data-t]"); if(!b) return;
  state.tab = b.getAttribute("data-t"); renderTabs(); renderPanel();
});
$("chips").addEventListener("click",function(e){
  var b = e.target.closest("[data-m]"); if(!b) return;
  state.mod = b.getAttribute("data-m");
  Array.prototype.forEach.call(document.querySelectorAll("#chips .chip"),function(c){ c.setAttribute("aria-pressed", String(c===b)); });
  renderPanel();
});
$("q").addEventListener("input",function(e){ state.q = e.target.value.trim().toLowerCase(); renderPanel(); });
document.addEventListener("visibilitychange",function(){ if(!document.hidden) refresh(); });

$("f-tel").textContent = CONFIG.telefones;
$("f-mail").textContent = CONFIG.emails;
var h0 = (location.hash||"").replace("#","");
if(TABS.some(function(t){return t.id===h0})) state.tab = h0;
renderAll();
refresh();
setInterval(refresh, Math.max(15, CONFIG.refreshSeconds)*1000);
</script>
</body>
</html>
