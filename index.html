<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Line-up Porto do Recife</title>
<link rel="icon" href="assets/logo/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css?v=20261020a">
<link rel="stylesheet" href="css/edit.css?v=20261020a">
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <a class="logo" href="https://www.portodorecife.pe.gov.br/" aria-label="Porto do Recife S.A. — site oficial"><img src="assets/logo/logo.png" alt="Porto do Recife S.A."></a>
      <div class="titles"><h1>LINE-UP DE EMBARCAÇÕES</h1><p>MEP - Movimentação de embarcações no Porto do Recife</p></div>
    </div>
    <div class="right">
      <div class="stamp">Atualizado em<b id="stamp">—</b><span class="resp" id="resp" hidden>Responsável pelo preenchimento: <strong id="resp-n"></strong><span id="resp-c"></span></span></div>
      <button class="btn ghost" id="btn-login" type="button" hidden>🔒 Entrar para editar</button>
    </div>
  </div>
</header>
<div class="nav" aria-hidden="true"></div>
<div class="warn" id="warn" hidden><div class="wrap" id="warn-t"></div></div>

<main class="wrap">
  <div class="editbar" id="editbar" hidden><span id="who"></span><button class="btn pri" id="btn-new" type="button">+ Nova embarcação</button><button class="btn" id="btn-aviso" type="button">Aviso no topo</button><button class="btn" id="btn-pw" type="button">Minha senha</button><button class="btn" id="btn-out" type="button">Sair</button></div>
  <div class="avisos" id="notice" hidden></div>
  <div class="tabs" role="tablist" aria-label="Situação das embarcações" id="tabs"></div>

  <div class="avisos tabaviso" id="tabnotice" hidden></div>

  <div class="tools">
    <div class="tools-row">
      <label class="searchbox">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="search" id="q" type="search" placeholder="Buscar embarcação, carga, agência…" aria-label="Buscar">
      </label>
      <button class="btn-f" id="btn-filtros" type="button" aria-expanded="false" aria-controls="fpanel">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M6 12h12M10 18h4"/></svg>
        Filtros <span class="badge" id="f-badge" hidden>0</span>
      </button>
      <div class="seg viewsw" id="viewsw" role="group" aria-label="Modo de exibição">
        <button type="button" data-v="cartoes" aria-pressed="true">Cartões</button>
        <button type="button" data-v="tabela" aria-pressed="false">Tabela completa</button>
      </div>
    </div>
    <div class="fpanel" id="fpanel" hidden></div>
    <div class="fsum" id="fsum" aria-live="polite"></div>
  </div>

  <div class="list" id="panel" role="tabpanel" aria-live="polite"></div>

  <section class="berths" id="berths-sec" aria-label="Ocupação dos berços">
    <h2 class="sec-t">Ocupação dos berços agora</h2>
    <div class="berth-grid" id="berths"></div>
  </section>

  <section class="mapa-sec" id="mapa-sec" aria-label="Mapa dos berços" hidden>
    <h2 class="sec-t">Mapa dos berços</h2>
    <div class="mapa-wrap">
      <div class="mapa" id="mapa">
        <img src="assets/mapa/mapa-cais-desenho.png?v=20261020a" alt="Ilustração do Porto do Recife com os berços numerados de 00-TA a 09" width="1050" height="390">
        <svg class="bercos" id="bercos" viewBox="0 0 1050 390" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div class="dots" id="dots"></div>
      </div>
    </div>
    <p class="mapa-dica">↔ Deslize o mapa para os lados para ver todos os berços.</p>
    <p class="mapa-leg"><span class="lg imp"></span>Importação <span class="lg exp"></span>Exportação <span class="lg out"></span>Outros serviços</p>
  </section>

  <footer>
    <span><b>Telefones</b> <span id="f-tel"></span></span>
    <span><b>E-mail</b> <span id="f-mail"></span></span>
  </footer>
</main>

<script src="js/edit.js?v=20261020a"></script>
<script src="js/tabela.js?v=20261020a"></script>
<script src="js/filtros.js?v=20261020a"></script>
<script src="js/mapa.js?v=20261020a"></script>
<script src="js/app.js?v=20261020a"></script>
</body>
</html>
